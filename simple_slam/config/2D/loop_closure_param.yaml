/**:
  ros__parameters:
    loop_closure:
      search_radius: 1.0 # [double] ループ候補を探索する半径距離 [m]
      skip_recent_frames: 20 # [int] ループ判定から除外する直近のフレーム数（誤検知防止）
      fitness_score_thresh: 0.3 # [double] ループを確定するフィットネススコアの閾値（小さいほどマッチング精度が高い）
      voxel_size: 0.01 # [double] マッチング処理前のダウンサンプリング用ボクセルサイズ [m]
